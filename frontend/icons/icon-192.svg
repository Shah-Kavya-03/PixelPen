<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3" />

  <!-- Pixel Grid Pattern in Background -->
  <g opacity="0.18">
    <rect x="36" y="36" width="16" height="16" rx="3" fill="#00f0ff" />
    <rect x="60" y="36" width="16" height="16" rx="3" fill="#00f0ff" />
    <rect x="84" y="36" width="16" height="16" rx="3" fill="#00f0ff" />
    <rect x="108" y="36" width="16" height="16" rx="3" fill="#00f0ff" />
    <rect x="140" y="36" width="16" height="16" rx="3" fill="#00f0ff" />
    
    <rect x="36" y="60" width="16" height="16" rx="3" fill="#00f0ff" />
    <rect x="140" y="60" width="16" height="16" rx="3" fill="#00f0ff" />
    
    <rect x="36" y="84" width="16" height="16" rx="3" fill="#00f0ff" />
    <rect x="140" y="84" width="16" height="16" rx="3" fill="#00f0ff" />
    
    <rect x="36" y="108" width="16" height="16" rx="3" fill="#00f0ff" />
    <rect x="140" y="108" width="16" height="16" rx="3" fill="#00f0ff" />

    <rect x="36" y="140" width="16" height="16" rx="3" fill="#00f0ff" />
    <rect x="60" y="140" width="16" height="16" rx="3" fill="#00f0ff" />
    <rect x="84" y="140" width="16" height="16" rx="3" fill="#00f0ff" />
    <rect x="108" y="140" width="16" height="16" rx="3" fill="#00f0ff" />
    <rect x="140" y="140" width="16" height="16" rx="3" fill="#00f0ff" />
  </g>

  <!-- Stylized Pen Nib + Digital AI Matrix -->
  <g filter="url(#neonGlow)">
    <!-- Pen Nib Body -->
    <path d="M96 28 L138 92 L116 142 L96 164 L76 142 L54 92 Z" fill="url(#penGrad)" opacity="0.95" />
    <!-- Center Nib Split Line -->
    <line x1="96" y1="62" x2="96" y2="148" stroke="#080a14" stroke-width="4" stroke-linecap="round" />
    <!-- Nib Breather Hole -->
    <circle cx="96" cy="104" r="6" fill="#080a14" />
    <!-- Neural Node Tip Pulse -->
    <circle cx="96" cy="164" r="5" fill="#00f0ff" />
  </g>

  <!-- Accent Digital Pixel Blocks -->
  <rect x="122" y="112" width="10" height="10" rx="2" fill="#00f0ff" />
  <rect x="60" y="112" width="10" height="10" rx="2" fill="#a855f7" />
  <rect x="110" y="70" width="8" height="8" rx="2" fill="#10b981" />
  <rect x="74" y="70" width="8" height="8" rx="2" fill="#00f0ff" />
</svg>
